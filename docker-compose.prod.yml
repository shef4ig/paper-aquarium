# «Бумажный мир» за Traefik — самостоятельная копия аквариума на своём
# поддомене. Общего рантайма с аквариумом нет: свой контейнер, свой том data/.
#
# Что нужно рядом с этим файлом:
#   .env    — DOMAIN=world.fantasy-games.ru
#   data/   — комнаты; создаётся сам, владельца проставить надо (uid 1000)
#
# Сеть web общая и живёт отдельно (её держит Traefik).

services:
  world:
    build: .
    image: paper-world:latest
    container_name: paper-world
    restart: unless-stopped
    environment:
      WORLD_MAX_DOLLS: ${WORLD_MAX_DOLLS:-30}
      WORLD_MAX_DECOR: ${WORLD_MAX_DECOR:-40}
      WORLD_MAX_DATA_MB: ${WORLD_MAX_DATA_MB:-1024}
    volumes:
      # Комнаты (расстановка, снимки) переживают пересборку образа.
      - ./data:/app/data
    expose:
      - "8100"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.world.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.world.entrypoints=websecure"
      - "traefik.http.routers.world.tls.certresolver=letsencrypt"
      - "traefik.http.services.world.loadbalancer.server.port=8100"
      - "traefik.http.middlewares.world-compress.compress=true"
      - "traefik.http.routers.world.middlewares=world-compress"

networks:
  web:
    external: true
