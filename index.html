<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="home.title">Бумажный мир</title>
<style>
  :root {
    --ink: #eaf6ff; --muted: #8aa6bd; --dim: #5f7c94;
    --card: rgba(9, 24, 40, 0.72); --line: rgba(140, 200, 255, 0.16); --accent: #58d6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 800px at 20% -10%, #0d4a6b 0%, transparent 60%),
      radial-gradient(900px 700px at 90% 10%, #0a3a5c 0%, transparent 55%),
      linear-gradient(180deg, #051624 0%, #030d17 100%);
    background-attachment: fixed;
    color: var(--ink);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 64px 24px 80px; }
  .head { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; margin-bottom: 36px; }
  header { flex: 1 1 340px; }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; font-weight: 650; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 16px; max-width: 620px; }
  .langrow { display: flex; justify-content: flex-end; }
  .langpick { display: inline-flex; gap: 4px; }
  .langpick button {
    appearance: none; cursor: pointer; font: inherit; font-size: 11.5px; letter-spacing: .5px;
    padding: 3px 8px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--dim);
    transition: color .15s, background .15s, border-color .15s;
  }
  .langpick button:hover { color: var(--ink); }
  .langpick button[aria-pressed="true"] { color: var(--accent); border-color: var(--line); background: rgba(88,214,255,.08); }

  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .room {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column; color: var(--ink); text-decoration: none; cursor: pointer;
    transition: transform .2s cubic-bezier(.2,.7,.2,1), border-color .2s, box-shadow .2s;
  }
  .room:hover { transform: translateY(-3px); border-color: rgba(88,214,255,.45); box-shadow: 0 20px 54px rgba(0,20,40,.5); }
  .room .shot { position: relative; aspect-ratio: 16 / 9; background: #0a1c2b; overflow: hidden; }
  .room .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .room .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 3px; }
  .room h2 { margin: 0; font-size: 18px; font-weight: 620; }
  .room .meta { color: var(--muted); font-size: 13px; }
  .room.locked { opacity: .78; }
  .room.locked .shot { filter: grayscale(.55) brightness(.7); }
  .room .lock {
    position: absolute; top: 10px; right: 10px; z-index: 1;
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-content: center;
    background: rgba(4,16,28,.75); border: 1px solid var(--line); font-size: 15px;
  }
  footer { padding-top: 30px; margin-top: 32px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <header>
      <h1 data-t="home.title">Бумажный мир</h1>
      <p data-t="home.lead"></p>
    </header>
    <div class="langrow"><span id="lang"></span></div>
  </div>

  <div class="rooms" id="rooms"></div>

  <footer><p style="margin:0" id="foot"></p></footer>
</div>

<script src="/assets/i18n.js"></script>
<script src="/assets/modal.js"></script>
<script src="/assets/room.js"></script>
<script>
(function () {
  'use strict';

  var box = document.getElementById('rooms');
  I18N.mount(document.getElementById('lang'));
  document.title = I18N.t('home.title');
  addEventListener('world:lang', function () { document.title = I18N.t('home.title'); render(); });

  function title(r) {
    return (r.titles && (r.titles[I18N.lang] || r.titles.ru)) || r.id;
  }

  function card(r) {
    var open = Room.isUnlocked(r.id);
    var el = document.createElement('a');
    el.className = 'room' + (open ? '' : ' locked');
    if (open) el.href = '/r/' + r.id;

    var shot = document.createElement('div');
    shot.className = 'shot';
    if (r.background) {
      var img = document.createElement('img');
      img.src = r.background; img.alt = ''; img.loading = 'lazy';
      shot.appendChild(img);
    }
    if (!open) {
      var lock = document.createElement('div');
      lock.className = 'lock'; lock.textContent = '🔒';
      shot.appendChild(lock);
    }
    el.appendChild(shot);

    var body = document.createElement('div');
    body.className = 'body';
    var h = document.createElement('h2'); h.textContent = title(r);
    var meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = open ? I18N.t('home.open') : I18N.t('home.locked');
    body.appendChild(h); body.appendChild(meta);
    el.appendChild(body);

    if (!open) {
      el.onclick = function (e) {
        e.preventDefault();
        Modal.alert({ title: I18N.t('home.locked.title'), text: I18N.t('home.locked.text') });
      };
    }
    return el;
  }

  function render() {
    box.textContent = '';
    fetch('/api/rooms/catalog')
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) {
        (d.rooms || []).forEach(function (r) { box.appendChild(card(r)); });
      })
      .catch(function () {
        document.getElementById('foot').textContent = I18N.t('home.noserver');
      });
  }

  render();
})();
</script>
</body>
</html>
